name = "aff-website"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
binding = "ASSETS"
directory = "dist/client"

[[d1_databases]]
binding = "DB"
database_name = "aff-story-db"
database_id = "b55e548c-cad5-41ae-a89d-e613dd1909bc"

# Main domain
[[routes]]
pattern = "aurastclaire.com"
custom_domain = true

[[routes]]
pattern = "www.aurastclaire.com"
custom_domain = true

# Subdomain source tracking — middleware redirects to main domain + ?sc=<platform>
[[routes]]
pattern = "ig.aurastclaire.com"
custom_domain = true

[[routes]]
pattern = "tt.aurastclaire.com"
custom_domain = true

[[routes]]
pattern = "x.aurastclaire.com"
custom_domain = true

[[routes]]
pattern = "pin.aurastclaire.com"
custom_domain = true

# Pets tenant
[[routes]]
pattern = "pets.vgpsoftware.com"
custom_domain = true

# Baking Science tenant
[[routes]]
pattern = "bakingscience.vgpsoftware.com"
custom_domain = true

# ── Staging environment ────────────────────────────────────────────────────────
[env.staging]
name = "aff-website-staging"
workers_dev = true

[env.staging.assets]
binding = "ASSETS"
directory = "dist/client"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "aff-story-db-staging"
database_id = "7ec860f9-0dd4-40a5-83bc-4e2d0faf12d1"

[[env.staging.kv_namespaces]]
binding = "SESSION"
id = "71194cbfcadf4ebea8740695c7ee9dc1"
